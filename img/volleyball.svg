<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <defs>
        <clipPath id="vb-clip">
            <circle cx="50" cy="50" r="45"/>
        </clipPath>
    </defs>

    <!-- ball: Mikasa yellow base, same as the intro animation -->
    <circle cx="50" cy="50" r="45" fill="#FFD400"/>

    <!-- one blue piece + three arcs, identical to the intro ball -->
    <g clip-path="url(#vb-clip)">
        <path d="M 64 4 C 38 32, 38 68, 64 96 L 100 96 L 100 4 Z" fill="#0057B8"/>
        <g fill="none" stroke="#0A0A0A" stroke-width="6" stroke-linecap="round">
            <path d="M 15 26 C 41 42, 41 58, 15 74"/>
            <path d="M 64 4 C 38 32, 38 68, 64 96"/>
            <path d="M 13 82 C 45 70, 73 58, 87 33"/>
        </g>
    </g>

    <!-- outline: 6, same weight as the intro ball -->
    <circle cx="50" cy="50" r="45" fill="none" stroke="#0A0A0A" stroke-width="6"/>
</svg>
