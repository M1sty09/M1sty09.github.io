<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>页面不存在 · 赛程</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; align-items: center; justify-content: center;
            background: #FBFAF7; color: #0A0A0A;
            font: 15px/1.7 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
            text-align: center;
        }
        h1 { margin: 0 0 10px; font-size: 1.4rem; letter-spacing: .02em; }
        a { color: #0057B8; font-weight: 800; }
    </style>
    <script>
        /* /<repo>/admin → /<repo>/admin.html */
        (function () {
            var parts = location.pathname.split('/').filter(Boolean);
            if (parts[parts.length - 1] === 'admin') {
                parts.pop();
                location.replace('/' + parts.concat('admin.html').join('/'));
            }
        })();
    </script>
</head>
<body>
    <div>
        <h1>页面不存在</h1>
        <p><a href="./index.html">回到赛程表</a> · <a href="./admin.html">数据管理</a></p>
    </div>
</body>
</html>
